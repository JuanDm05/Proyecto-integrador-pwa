name: Angular CI & Merge to Main


# 1. Definición del evento que dispara el workflow
on:
  push:
    branches:
      - Dirier # Se ejecuta solo cuando se suben cambios a la rama 'Dirier'


# 2. Permisos necesarios para que el GitHub Actions bot pueda escribir en el repositorio (hacer el merge y push)
permissions:
  contents: write # Permite la escritura (necesario para el push a main)
  pull-requests: write # Permiso general para PRs, aunque aquí usamos merge directo


jobs:
  run-tests-and-merge:
    name: Run Tests & Auto-Merge
    runs-on: ubuntu-latest
   
    steps:
      # --- SETUP: Obtener el Código ---
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 es crucial para que Git pueda ver el historial completo
          # y realizar el checkout/merge correctamente.
          fetch-depth: 0
         
      # --- SETUP: Configuración de Node.js ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ajusta esto si tu proyecto usa otra versión de Node
          cache: 'npm'
         
      # --- SETUP: Instalación de Dependencias ---
      - name: Install Dependencies
        # npm ci es más rápido y seguro para entornos CI que npm install
        run: npm ci


      # --- TEST: Ejecución de Pruebas ---
      - name: Run Angular Tests (Headless)
        # Ejecuta tu script configurado en package.json en modo sin interfaz gráfica
        run: npm run test:ci
       
      # --- DEPLOYMENT/MERGE: Fusión Condicional ---
      - name: Merge Dirier to Main on Success
        # if: success() garantiza que este paso solo se ejecuta si el paso anterior pasó
        if: success()
        run: |
          echo "✅ Pruebas exitosas. Iniciando fusión a la rama main."
         
          # Configurar la identidad de Git para el commit automático
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
         
          # 1. Cambiar a la rama principal
          git checkout main
         
          # 2. Fusionar la rama 'Dirier' a 'main'
          # --no-ff fuerza un merge commit, manteniendo un historial claro
          git merge origin/Dirier --no-ff -m "Merge branch 'Dirier' into main [skip ci]"
         
          # 3. Subir los cambios fusionados a GitHub
          git push origin main
         
          echo " Rama 'Dirier' fusionada exitosamente a 'main'."
