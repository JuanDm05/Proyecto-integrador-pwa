name: Angular CI & Merge to Main

# 1. Cuándo se ejecuta el pipeline
on:
  push:
    branches:
      - dirier # El pipeline se ejecuta solo cuando se suben cambios a la rama 'dirier'

# 2. Permisos necesarios para escribir en el repositorio (para el paso de merge)
permissions:
  contents: write # Permite que el GitHub Token fusione y haga push
  pull-requests: write # Necesario para cerrar el PR si se usa uno, aunque aquí usamos merge directo

jobs:
  run-tests-and-merge:
    name: Run Tests & Auto-Merge
    runs-on: ubuntu-latest
    
    steps:
      # --- SETUP: Configuración del Entorno ---
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Necesario para poder hacer el merge y push a main
          fetch-depth: 0 
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Asegúrate de que esta versión coincida con tu proyecto
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      # --- TEST: Ejecución de Pruebas ---
      - name: Run Angular Tests (Headless)
        run: npm run test:ci # Usaremos un script npm para la ejecución sin interfaz gráfica (headless)
        
      # --- DEPLOYMENT/MERGE: Fusión Condicional ---
      - name: Merge to Main on Success
        if: success() # Este paso SÓLO se ejecuta si el paso anterior (Run Angular Tests) tuvo éxito
        run: |
          echo "✅ Pruebas exitosas. Iniciando fusión a la rama main."
          
          # Configurar la identidad de Git para el commit automático
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          
          # Fusionar (merge) la rama 'dirier' a la rama 'main'
          git checkout main
          git merge origin/dirier --no-ff -m "Merge branch 'dirier' into main [skip ci]"
          
          # Subir (push) los cambios fusionados a GitHub
          git push origin main
          
          echo "🚀 Rama 'dirier' fusionada exitosamente a 'main'."